name: Release

# Publishes both packages to npm when a version tag is pushed (git tag v0.1.1 && git push origin v0.1.1).
# It uses npm trusted publishing: GitHub proves the workflow's identity to npm, so no npm token is
# stored here. Each package needs a trusted publisher set on npmjs.com for this repository,
# the workflow file "release.yml" and the environment "npm-publish".

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The tag is on main and matches both package versions
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::The tag is not on main."; exit 1; }
          TAG="${GITHUB_REF_NAME#v}"
          for p in client react; do
            V=$(node -p "require('./packages/$p/package.json').version")
            [ "$V" = "$TAG" ] || { echo "::error::packages/$p is $V, the tag is $TAG."; exit 1; }
          done

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Trusted publishing needs npm 11.5.1 or later
        run: |
          npm --version
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); if (a<11||(a===11&&(b<5||(b===5&&c<1)))) { console.error("npm is too old"); process.exit(1); }' "$(npm --version)"

      - run: npm ci
      - run: npm run build
      - run: npm test

      # The client first: the React package depends on it.
      - name: Publish the client
        run: npm publish -w packages/client --access public --provenance
      - name: Publish the React controls
        run: npm publish -w packages/react --access public --provenance
