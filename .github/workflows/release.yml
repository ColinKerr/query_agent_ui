name: Release

# Stages both packages on npm when a version tag is pushed (git tag v0.1.1 && git push origin v0.1.1).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The tag is on main and matches both package versions
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::The tag is not on main."; exit 1; }
          TAG="${GITHUB_REF_NAME#v}"
          for p in client react; do
            V=$(node -p "require('./packages/$p/package.json').version")
            [ "$V" = "$TAG" ] || { echo "::error::packages/$p is $V, the tag is $TAG."; exit 1; }
          done

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # `npm stage publish` needs npm 11.15.0 or later. Node 24 may ship an older npm.
      - name: Make sure npm is 11.15.0 or later
        run: |
          set -euo pipefail
          old() { node -e 'const [a,b]=process.argv[1].split(".").map(Number); process.exit(a>11||(a===11&&b>=15)?1:0)' "$(npm --version)"; }
          if old; then npm install -g npm@^11.15.0; fi
          npm --version
          old && { echo "::error::npm is still older than 11.15.0."; exit 1; } || true

      - run: npm ci
      - run: npm run build
      - run: npm test

      # The client first: the React package depends on it. Run from each package's directory:
      # npm's docs say `npm stage` is unaware of workspaces. A staged version is not public.
      - name: Stage the client
        working-directory: packages/client
        run: npm stage publish --access public --provenance
      - name: Stage the React controls
        working-directory: packages/react
        run: npm stage publish --access public --provenance
